<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#202426"/>

  <!-- App-style rounded square -->
  <rect x="82" y="60" width="860" height="860" rx="170"
        fill="#fff" filter="url(#shadow)"/>

  <!-- TURFLY wordmark -->
  <g fill="#000" font-family="Inter, Arial, Helvetica, sans-serif"
     font-weight="900" font-style="italic" text-anchor="middle">
    <text x="512" y="510" font-size="158" letter-spacing="-9">TURFLY</text>
  </g>

  <!-- Wing/motion accent integrated around the Y -->
  <path d="M761 424
           C807 400 846 391 891 394
           C858 416 826 439 792 463
           C819 454 844 452 868 457
           C840 478 811 493 780 504
           Z"
        fill="#000"/>

  <!-- Tagline -->
  <text x="512" y="573"
        fill="#000"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="600"
        letter-spacing="12"
        text-anchor="middle">BOOK | PLAY | REPEAT</text>
</svg>
